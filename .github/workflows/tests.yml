# Tests Kryptax : moteur, formats, export PDF, golden, U.S.A., U.K., import, sécurité et lecture PDF (pdf.js embarqué), sous plusieurs fuseaux horaires.
# Node + poppler-utils (pdftotext / pdftoppm pour testexport.js) ; jsdom installé hors dépôt pour testprivacy.js. Empreintes des bibliothèques : testlibs.js.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Paris, UTC, America/Los_Angeles, Asia/Tokyo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: node test.js
        run: node test.js > out-test.txt; s=$?; cat out-test.txt; ! grep -q "ÉCHEC" out-test.txt && exit $s
      - name: node testformats.js
        run: node testformats.js > out-formats.txt; s=$?; cat out-formats.txt; ! grep -q "ÉCHEC" out-formats.txt && exit $s
      - name: node testexport.js
        run: node testexport.js > out-export.txt; s=$?; cat out-export.txt; ! grep -q "ÉCHEC" out-export.txt && exit $s
      - name: node testgolden.js
        run: node testgolden.js > out-golden.txt; s=$?; cat out-golden.txt; ! grep -q "ÉCHEC" out-golden.txt && exit $s
      - name: node testus.js
        run: node testus.js > out-us.txt; s=$?; cat out-us.txt; ! grep -q "ÉCHEC" out-us.txt && exit $s
      - name: node testuk.js
        run: node testuk.js > out-uk.txt; s=$?; cat out-uk.txt; ! grep -q "FAIL\|ÉCHEC" out-uk.txt && exit $s
      - name: node testimport.js
        run: node testimport.js > out-import.txt; s=$?; cat out-import.txt; ! grep -q "KO  \|ÉCHEC" out-import.txt && exit $s
      - name: node testsecu.js
        run: node testsecu.js > out-secu.txt; s=$?; cat out-secu.txt; ! grep -q "ÉCHEC" out-secu.txt && exit $s
      - name: node testpdf.mjs
        run: node testpdf.mjs > out-pdf.txt; s=$?; cat out-pdf.txt; ! grep -q "ÉCHEC" out-pdf.txt && exit $s
      - name: node testusref.js
        run: node testusref.js > out-usref.txt; s=$?; cat out-usref.txt; ! grep -q "ÉCHEC" out-usref.txt && exit $s
      - name: node testustz.js
        run: node testustz.js > out-ustz.txt; s=$?; cat out-ustz.txt; ! grep -q "ÉCHEC" out-ustz.txt && exit $s
      - name: Canada (testca.js)
        run: node testca.js > out-ca.txt; s=$?; cat out-ca.txt; ! grep -q "ÉCHEC" out-ca.txt && exit $s
      - name: Australia (testau.js)
        run: node testau.js > out-au.txt; s=$?; cat out-au.txt; ! grep -q "ÉCHEC" out-au.txt && exit $s
      - name: Échanges à confirmer (testswap.js)
        run: node testswap.js > out-swap.txt; s=$?; cat out-swap.txt; ! grep -q "ÉCHEC" out-swap.txt && exit $s
      - name: Profils de plateformes (testprofiles.js)
        run: node testprofiles.js > out-profiles.txt; s=$?; cat out-profiles.txt; ! grep -q "ÉCHEC" out-profiles.txt && exit $s
      - name: Bibliothèques embarquées, empreintes SHA-256 (testlibs.js)
        run: node testlibs.js > out-libs.txt; s=$?; cat out-libs.txt; ! grep -q "ÉCHEC" out-libs.txt && exit $s
      - name: jsdom (test uniquement, hors dépôt)
        run: npm install --no-save --no-audit --no-fund --prefix /tmp/jd jsdom@29.1.1
      - name: Ne rien mémoriser (testprivacy.js, jsdom)
        run: JSDOM_PATH=/tmp/jd/node_modules/jsdom node testprivacy.js > out-privacy.txt; s=$?; cat out-privacy.txt; ! grep -q "ÉCHEC" out-privacy.txt && exit $s
